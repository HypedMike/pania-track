name: rust_lib_pania
description: "Builds the Rust core (rust/) for Android with cargokit, so Dart can load it."
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
