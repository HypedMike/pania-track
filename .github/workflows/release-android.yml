name: Release Android

# Every push/merge to main bumps the minor version (latest vX.Y.Z tag -> vX.(Y+1).0),
# builds and signs the APK, then publishes a GitHub Release (which creates the tag).
# Pushing a tag like v1.0.0 by hand still works and uses that exact version (use it for major bumps).
# Manual runs only build and upload the APK as a workflow artifact.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two merges can't compute the same version.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)"
            LATEST="${LATEST:-$(node -p "require('./package.json').version")}"
            IFS=. read -r MAJOR MINOR _ <<< "$LATEST"
            VERSION="$MAJOR.$((MINOR + 1)).0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK pieces
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "cmdline-tools;latest"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set version from tag
        id: version
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}" | tee -a "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_LATEST_RELEASE_URL: ${{ vars.VITE_LATEST_RELEASE_URL }}
        run: pnpm tauri android build --apk --target aarch64 --target armv7

      - name: Verify signature and version
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n1)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:"

      - name: Name the artifact
        run: |
          mkdir dist-release
          cp "$APK" "dist-release/pania-${{ steps.version.outputs.version }}.apk"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist-release/*.apk
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: pania-apk
          path: dist-release/*.apk
