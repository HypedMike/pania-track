name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_LATEST_RELEASE_URL: ${{ vars.VITE_LATEST_RELEASE_URL }}

  # Unit tests of the Android plugin's pure logic, on a plain JVM (no Android SDK needed).
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: src-tauri/plugins/trail-recorder/android/jvm-tests
        run: gradle test --no-daemon

  # Builds the Rust backend (desktop target) and runs its unit tests. The Android-only parts
  # (the Kotlin plugins) are compiled by the release workflow, not here.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! embeds the frontend build and fails if the folder is missing.
      # A placeholder is enough to compile; the frontend job checks the real build.
      - name: Create placeholder frontend build
        working-directory: .
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Build
        run: cargo build --locked
      - name: Test
        # The app crate plus the plugin crates whose Rust code has its own unit tests.
        run: cargo test --locked -p pania -p tauri-plugin-app-installer
