name: pania
description: "Pania: a local-first trail recorder and viewer. Record hikes with GPS, import GPX/KML tracks, follow a trail, analyse it, and share it over Nostr."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Rust core (analysis, tracks, Nostr, updater) through flutter_rust_bridge.
  rust_lib_pania:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  collection: ^1.19.0
  # Android service, Keystore and installer.
  pania_native:
    path: packages/pania_native

  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  sqflite: ^2.4.0
  shared_preferences: ^2.5.0
  path: ^1.9.0
  uuid: ^4.5.0
  path_provider: ^2.1.0
  geolocator: ^14.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  http: ^1.4.0
  xml: ^6.5.0
  share_plus: ^12.0.0
  file_picker: ^10.0.0
  url_launcher: ^6.3.0
  intl: any
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/migrations/
    - assets/logo.png
    - assets/pania_terrain.bin
