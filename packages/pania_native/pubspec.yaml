name: pania_native
description: "Pania's Android side - the GPS recording foreground service with live stats, Keystore secret storage and the APK installer."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: app.pania.trailrecorder
        pluginClass: PaniaNativePlugin
