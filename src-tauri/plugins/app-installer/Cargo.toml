[package]
name = "tauri-plugin-app-installer"
version = "0.1.0"
edition = "2021"
description = "Downloads a new Pania APK from the project's GitHub releases and hands it to Android's installer."
links = "tauri-plugin-app-installer"
publish = false

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Blocking HTTP client; rustls with bundled roots (no Android JNI trust-store setup needed).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
