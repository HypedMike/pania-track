[package]
name = "tauri-plugin-secret-store"
version = "0.1.0"
edition = "2021"
description = "Stores small secrets (the Nostr secret key) encrypted with a key held in the Android Keystore."
links = "tauri-plugin-secret-store"
publish = false

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
