include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - rust/**
    - rust_builder/**
    # Generated by flutter_rust_bridge_codegen from rust/src/api.
    - lib/core/rust/**
    - packages/**/android/**
    - android/**

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true

formatter:
  page_width: 120
